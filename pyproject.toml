[project]
name = "sdss-hartmannActor"
version = "3.1.0a1"
description = "An actor to analyse Hartmann images and apply corrections."
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "José Sánchez-Gallego", email = "gallegoj@uw.edu" },
    { name = "John Parejko", email = "parejkoj@uw.edu" },
]
keywords = ["astronomy", "software"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.8.0",
    "astropy>=6.0",
    "sdsstools>=1.9.0",
    "sdss-clu>=2.0.0",
    "click-default-group>=1.2.2",
    "polars>=1.0.0",
    "seaborn>=0.11.2",
    "matplotlib>=3.5.2",
    "rich>=12.6.0",
]

[project.urls]
Homepage = "https://github.com/sdss/hartmannActor"
Repository = "https://github.com/sdss/hartmannActor"

[project.scripts]
hartmann = "hartmann.__main__:hartmann"

[dependency-groups]
dev = [
    "ipython>=8.0.0",
    "invoke>=1.3.0",
    "doc8>=0.8.0",
    "pytest>=9.0.3",
    "pytest-cov>=2.8.1",
    "pytest-sugar>=0.9.2",
    "pytest-asyncio>=0.19.0",
    "coverage[toml]>=5.0",
    "ipdb>=0.12.3",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = 'py312'
exclude = ["typings/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["hartmann"]
lines-after-imports = 2
section-order = ["future", "standard-library", "typing", "third-party", "sdss", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
typing = ["typing"]
sdss = ["sdsstools", "clu"]

[tool.pytest.ini_options]
addopts = "--cov hartmann --cov-report xml --cov-report html --cov-report term"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = [
    "*/__main__.py",
    "*/calibration.py"
]

[tool.coverage.report]
exclude_lines = [
    "# pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hartmann"
module-root = "src"
